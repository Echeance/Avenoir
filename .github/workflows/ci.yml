name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule l'exécution précédente sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Formatage et scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installer clang-format (même version majeure qu'en local)
        run: pipx install "clang-format==23.1.*"
      - name: Vérifier le formatage
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: Analyser les scripts shell (shellcheck)
        run: git ls-files '*.sh' | xargs shellcheck
      - name: Analyser les scripts PowerShell (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning, Error `
              -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: GCC 14,          cc: gcc-14,   cxx: g++-14,     preset: debug }
          # Clang ≥ 19 : std::expected de libstdc++ exige __cpp_concepts ≥ 202002L.
          - { name: Clang 20,        cc: clang-20, cxx: clang++-20, preset: debug }
          - { name: ASan + UBSan,    cc: clang-20, cxx: clang++-20, preset: asan }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      # Par apt ; si les miroirs Ubuntu sont injoignables (panne déjà vue sur
      # les runners), par pipx (paquet PyPI « ninja »), sans apt.
      - name: Installer Ninja
        run: |
          if ! { sudo apt-get update -q && sudo apt-get install -y -q ninja-build; }; then
            echo "::warning::apt indisponible : Ninja installé par pipx"
            pipx install ninja
          fi
          ninja --version
      - name: Installer Clang 20 (dépôt apt.llvm.org)
        if: startsWith(matrix.cc, 'clang')
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
      - name: Erreurs de compilation en annotations
        run: echo "::add-matcher::.github/problem-matchers/gcc-clang.json"
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: ${{ matrix.cxx }}
      - name: Configurer, compiler et tester (scripts/build.sh)
        run: scripts/build.sh ${{ matrix.preset }}

  windows:
    name: Windows MSVC
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: msvc-static-md
      - name: Erreurs de compilation en annotations
        shell: bash
        run: echo "::add-matcher::.github/problem-matchers/msvc.json"
      # Windows PowerShell 5.1, sans environnement MSVC préchargé : vérifie
      # aussi que le script trouve Visual Studio tout seul.
      - name: Configurer, compiler et tester (scripts/build.ps1)
        shell: powershell
        run: scripts\build.ps1 debug
