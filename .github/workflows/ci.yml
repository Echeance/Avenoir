name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule l'exécution précédente sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Formatage (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installer clang-format (même version majeure qu'en local)
        run: pipx install "clang-format==23.1.*"
      - name: Vérifier le formatage
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: GCC 14,          cc: gcc-14,   cxx: g++-14,     preset: debug }
          - { name: Clang 18,        cc: clang-18, cxx: clang++-18, preset: debug }
          - { name: ASan + UBSan,    cc: clang-18, cxx: clang++-18, preset: asan }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: ${{ matrix.cxx }}
      - name: Configurer
        run: cmake --preset ${{ matrix.preset }}
      - name: Compiler
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Tester
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: Windows MSVC
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Environnement MSVC (cl, Ninja)
        uses: ilammy/msvc-dev-cmd@v1
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: msvc-static-md
      - name: Configurer
        run: cmake --preset debug -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
      - name: Compiler
        run: cmake --build --preset debug
      - name: Tester
        run: ctest --preset debug
