name: Release

# Publier une version : mettre à jour la version dans CMakeLists.txt et
# vcpkg.json, committer, puis pousser un tag du même numéro.
#
#   Stable (« Latest »)  : git tag v1.2.0         && git push origin v1.2.0
#   Pré-version          : git tag v1.2.0-beta.1  && git push origin v1.2.0-beta.1
#                          (suffixes acceptés : -alpha.N, -beta.N, -rc.N)
#
# Les versions 0.x et tous les tags avec suffixe sont publiés en pré-version ;
# seule une version stable ≥ 1.0.0 devient « Latest ».
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    name: Binaire ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: Linux x64,   os: ubuntu-24.04, archive: avenoir-linux-x64.tar.gz }
          - { name: Windows x64, os: windows-2025, archive: avenoir-windows-x64.zip }
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version du projet
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag invalide : $GITHUB_REF_NAME (attendu : vX.Y.Z ou vX.Y.Z-alpha|beta|rc.N)"; exit 1
          fi
          number="${BASH_REMATCH[1]}"
          suffix="${BASH_REMATCH[2]}"
          project=$(sed -nE 's/^ +VERSION ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CMakeLists.txt)
          manifest=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['version'])" 2>/dev/null \
                     || python -c "import json; print(json.load(open('vcpkg.json'))['version'])")
          echo "tag=$GITHUB_REF_NAME numéro=$number suffixe=$suffix CMakeLists.txt=$project vcpkg.json=$manifest"
          [ "$number" = "$project" ] && [ "$number" = "$manifest" ] || {
            echo "::error::Le numéro du tag ($number) ne correspond pas à la version du projet ($project / $manifest)"; exit 1; }
          echo "AVENOIR_VERSION_SUFFIX=$suffix" >> "$GITHUB_ENV"

      - name: Outils Linux (GCC 14, Ninja, autotools pour libsodium)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build autoconf autoconf-archive automake libtool
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Environnement MSVC (cl, Ninja)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: release

      - name: Configurer (Linux)
        if: runner.os == 'Linux'
        # libstdc++ liée statiquement : le binaire tourne sur d'autres distributions.
        run: >
          cmake --preset release -DAVENOIR_BUILD_TESTS=ON
          "-DAVENOIR_VERSION_SUFFIX=${{ env.AVENOIR_VERSION_SUFFIX }}"
          "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
      - name: Configurer (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake --preset release -DAVENOIR_BUILD_TESTS=ON -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          "-DAVENOIR_VERSION_SUFFIX=${{ env.AVENOIR_VERSION_SUFFIX }}"

      - name: Compiler
        run: cmake --build --preset release
      - name: Tester
        run: ctest --test-dir build/release --output-on-failure --no-tests=error

      - name: Empaqueter
        shell: bash
        run: |
          mkdir -p dist/avenoir
          cp README.md LICENSE.md config.example.toml dist/avenoir/
          # Modules fournis (programme + module.toml), à côté de l'exécutable.
          cp -r build/release/apps/cli/modules dist/avenoir/
          # La CLI (avenoir) et le démon qu'elle lance (avenoird), côte à côte.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/release/apps/cli/avenoir.exe build/release/apps/cli/avenoird.exe dist/avenoir/
            (cd dist && 7z a -bso0 "${{ matrix.archive }}" avenoir)
          else
            cp build/release/apps/cli/avenoir build/release/apps/cli/avenoird dist/avenoir/
            tar -C dist -czf "dist/${{ matrix.archive }}" avenoir
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  publish:
    name: Publier la release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Pré-version : tag avec suffixe (-alpha/-beta/-rc) ou version 0.x.
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          # « Latest » uniquement pour une version stable ≥ 1.0.0.
          make_latest: ${{ (contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.')) && 'false' || 'true' }}
