# Configuration d'Avenoir — copiez ce fichier en `config.toml`.
# Les clés d'API ne sont JAMAIS écrites ici : indiquez le nom de la variable
# d'environnement qui les contient.

# ─── Fournisseur LLM (un seul bloc [llm] actif) ────────────────────────────

# Option A — LLM local via Ollama (ou llama.cpp server, LM Studio, vLLM…)
[llm]
provider = "openai_compatible"
base_url = "http://localhost:11434/v1"
model = "gemma4:26b-a4b"      # carte de 24 Go ; plus léger : "ministral-3:8b" (PROJECT.md § 2.5)
temperature = 0.2
reasoning_effort = "none"     # modèles qui « réfléchissent » (Qwen…) : bien plus rapide

# Option B — API compatible OpenAI distante (OpenAI, Mistral, OpenRouter…)
# [llm]
# provider = "openai_compatible"
# base_url = "https://api.mistral.ai/v1"
# model = "mistral-large-latest"
# api_key_env = "MISTRAL_API_KEY"

# Option C — Anthropic
# [llm]
# provider = "anthropic"
# model = "claude-sonnet-5-5"
# api_key_env = "ANTHROPIC_API_KEY"
# max_tokens = 4096

# Option D — Abonnement Claude (Pro / Max) via la CLI Claude Code, sans clé
# d'API ni facturation au token : la CLI doit être installée et connectée
# (`claude` puis `/login`). Les outils propres à Claude Code sont désactivés ;
# il sert uniquement de moteur de langage. Usage personnel uniquement.
# [llm]
# provider = "claude_code"
# model = "sonnet"            # optionnel : sonnet, opus, haiku…
# command = "claude"          # chemin complet si besoin (Windows : claude.exe)
# timeout_secs = 180

# ─── Agent ─────────────────────────────────────────────────────────────────
[agent]
max_steps = 10        # allers-retours LLM ↔ outils maximum par requête
fast_path = true      # commandes simples traitées sans LLM
# system_prompt = "…" # remplace le prompt par défaut

# ─── Permissions par niveau de risque : "allow" | "confirm" | "deny" ───────
# `sensitive` ne peut jamais être "allow" (forcé à "confirm").
[permissions]
read_only = "allow"
reversible = "allow"
sensitive = "confirm"

# ─── Modules ───────────────────────────────────────────────────────────────
# Les modules fournis avec Avenoir sont dans `<installation>/modules/<id>/`,
# ceux que vous installez dans le dossier de données d'Avenoir
# (`~/.local/share/avenoir/modules/<id>/`, `%LOCALAPPDATA%\avenoir\modules\<id>\`).
# Chacun se décrit dans son `module.toml` ; ici, seuls VOS réglages par module.
# Un module fourni est activé par défaut ; un module que vous installez reste
# DÉSACTIVÉ tant que vous ne l'activez pas ici. /modules liste leur état.
#
# [modules.meteo]
# enabled = false             # désactiver un module fourni
#
# [modules.calendrier]
# enabled = true              # activer un module installé par vous
# # Relever le risque d'un outil (nom court, sans « calendrier__ ») :
# risk = { update_event = "sensitive" }
# # L'ABAISSER sous celui du manifeste se fait uniquement par la commande
# # /risque (avertissement + saisie de « Je sais ce que je fais ») : une baisse
# # écrite ici à la main est ignorée.
