# Configuration d'Avenoir — copiez ce fichier en `config.toml`.
# Les clés d'API ne sont JAMAIS écrites ici : indiquez le nom de la variable
# d'environnement qui les contient.

# ─── Modèles (LLM) ─────────────────────────────────────────────────────────
# Un modèle par section [models.<nom>] (nom : minuscules, chiffres, - et _).
# Le premier de la liste sert au premier lancement ; ensuite, Avenoir reprend
# le dernier modèle utilisé. Changez à tout moment : `/modele <nom>`, « passe
# sur le modèle leger », ou en le demandant. Passer à un modèle distant demande
# confirmation (la conversation sortirait de la machine).
# Sans aucun modèle, seule la voie rapide répond (« quelle heure est-il »…).

# LLM local via Ollama (ou llama.cpp server, LM Studio, vLLM…)
[models.gemma]
provider = "openai_compatible"
base_url = "http://localhost:11434/v1"
model = "gemma4:26b-a4b"      # carte de 24 Go (docs/PROJECT.md § 2.5)
temperature = 0.2
reasoning_effort = "none"     # modèles qui « réfléchissent » (Qwen…) : bien plus rapide
# local = true                # modèle qui vous appartient (cette machine ou votre
                              # réseau) : pas de confirmation pour y passer,
                              # chargement et déchargement permis. Par défaut,
                              # seule l'adresse de la machine est tenue pour locale.

# Modèle local léger (~10 Go)
[models.leger]
provider = "openai_compatible"
base_url = "http://localhost:11434/v1"
model = "ministral-3:8b"
temperature = 0.2
reasoning_effort = "none"

# API compatible OpenAI distante (OpenAI, Mistral, OpenRouter…)
# [models.mistral]
# provider = "openai_compatible"
# base_url = "https://api.mistral.ai/v1"
# model = "mistral-large-latest"
# api_key_env = "MISTRAL_API_KEY"   # NOM de la variable, jamais la clé

# Anthropic
# [models.sonnet]
# provider = "anthropic"
# model = "claude-sonnet-5-5"
# api_key_env = "ANTHROPIC_API_KEY"
# max_tokens = 4096

# Abonnement Claude (Pro / Max) via la CLI Claude Code, sans clé d'API ni
# facturation au token : la CLI doit être installée et connectée (`claude`
# puis `/login`). Les outils propres à Claude Code sont désactivés ; il sert
# uniquement de moteur de langage. Usage personnel uniquement.
# [models.claude]
# provider = "claude_code"
# model = "haiku"             # optionnel : sonnet, opus, haiku…
# command = "claude"          # chemin complet si besoin (Windows : claude.exe)
# timeout_secs = 180
# persistent = true          # garder `claude` ouvert entre deux requêtes (bien plus
#                             # rapide) ; false : un lancement par appel

# ─── Agent ─────────────────────────────────────────────────────────────────
[agent]
max_steps = 10        # allers-retours LLM ↔ outils maximum par requête
fast_path = true      # commandes simples traitées sans LLM
local_only = false    # true : mode « local uniquement », aucun modèle distant
                      # n'est utilisé (la conversation ne quitte jamais la machine)
unload_on_switch = true # en changeant de modèle, décharger l'ancien s'il est sur le
                        # même serveur (libère sa mémoire vidéo) ; false : le garder
                        # chargé pour alterner vite entre deux petits modèles
verify_replies = true # une action que le modèle annonce sans l'avoir faite
                      # (« je bascule sur qwen » sans changer de modèle) le fait
                      # relancer, puis est signalée ; false : réponses non vérifiées
# system_prompt = "…" # remplace le prompt par défaut

# ─── Recherche web ─────────────────────────────────────────────────────────
# Par défaut, SearXNG en local : Avenoir lance son image officielle avec
# podman (ou docker) à la première recherche (téléchargée la première fois,
# environ 270 Mo), accessible seulement depuis cette machine, et l'arrête
# après une période sans recherche ou à sa fermeture. Sans podman ni docker :
# DuckDuckGo (version HTML, sans compte ni clé).
[web]
local_searxng = true      # false : jamais de conteneur lancé par Avenoir
searxng_idle_minutes = 10 # arrêt de l'instance locale après cette inactivité
# searxng_url = "http://localhost:8888"  # votre propre instance (format JSON
#                                        # activé) : remplace l'instance locale
# engine = "duckduckgo"   # moteur de départ ; /moteur le change (retenu)

# ─── Permissions par niveau de risque : "allow" | "confirm" | "deny" ───────
# `sensitive` ne peut jamais être "allow" (forcé à "confirm").
[permissions]
read_only = "allow"
reversible = "allow"
sensitive = "confirm"

# ─── Modules ───────────────────────────────────────────────────────────────
# Les modules fournis avec Avenoir sont dans `<installation>/modules/<id>/`,
# ceux que vous installez dans le dossier de données d'Avenoir
# (`~/.local/share/avenoir/modules/<id>/`, `%LOCALAPPDATA%\avenoir\modules\<id>\`).
# Chacun se décrit dans son `module.toml` ; ici, seuls VOS réglages par module.
# Un module fourni est activé par défaut ; un module que vous installez reste
# DÉSACTIVÉ tant que vous ne l'activez pas ici. /modules liste leur état.
#
# [modules.meteo]
# enabled = false             # désactiver un module fourni
#
# [modules.calendrier]
# enabled = true              # activer un module installé par vous
# # Relever le risque d'un outil (nom court, sans « calendrier__ ») :
# risk = { update_event = "sensitive" }
# # L'ABAISSER sous celui du manifeste se fait uniquement par la commande
# # /risque (avertissement + saisie de « Je sais ce que je fais ») : une baisse
# # écrite ici à la main est ignorée.
